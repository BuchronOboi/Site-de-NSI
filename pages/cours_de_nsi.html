<!DOCTYPE html>
<html lang="fr" data-theme="clair">

<head>
  <title> NSI - Clément LEVAL </title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/styles/style_principal.css" type="text/css" />
</head>

<body>
  <div id="entete-de-page">
    NSI - Clément LEVAL
  </div><br>
  <div id="menu-placeholder"></div>

  <div id="grand-texte">📒 Cours de NSI</div>

  <div class="galerie">
    <a class="fiche" href="/pages/fiches/fiche1.html">
      <img src="https://cmsphoto.ww-cdn.com/superstatic/2171210/art/default/45075457-36564713.jpg?v=1587391639&force_webp=1" alt="Fiche 1">
      <p>Fiche 1 - Présentation de la NSI</p>
    </a>

    <a class="fiche" href="/pages/fiches/fiche2.html">
      <img src="/images/fiche-2-apercu.png" alt="Fiche 2">
      <p>Fiche 2 - HTML et CSS</p>
    </a>

    <a class="fiche" href="/pages/fiches/fiche3.html">
      <img style="object-fit: contain;" src="/images/fiche-3-apercu.png" alt="Fiche 3">
      <p>Fiche 3 - Programmation en Python</p>
    </a>
    <a class="fiche" href="/pages/fiches/fiche4.html">
      <img style="object-fit: contain;" src="/images/fiche-4-apercu.webp" alt="Fiche 4">
      <p>Fiche 4 - Les booléens</p>
    </a>
  </div>

</body>
<script>
  fetch("/pages/menu.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("menu-placeholder").innerHTML = data;

      // -- init du mode sombre (exécuté immédiatement après l'injection) --
      (function initTheme() {
        const body = document.body;

        // appliquer la préférence sauvegardée
        if (localStorage.getItem('theme') === 'dark') {
          body.classList.add('dark-mode');
        }

        // trouver tous les boutons/éléments qui doivent toggler le thème
        const toggles = document.querySelectorAll('.theme-toggle');

        toggles.forEach(btn => {
          btn.addEventListener('click', (e) => {
            /*   e.preventDefault(); // au cas où c'est un <a> */
            body.classList.toggle('dark-mode');
            const theme = body.classList.contains('dark-mode') ? 'dark' : 'light';
            localStorage.setItem('theme', theme);
          });
        });
      })();
    })
</script>

</html>
