<!DOCTYPE html>
<html lang="fr" data-theme="clair">

<head>
	<title> NSI - Clément LEVAL </title>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="../../../styles/style_principal.css" type="text/css" />
</head>

<body>
	<div id="entete-de-page">
		NSI - Clément LEVAL
	</div><br>
	<div id="menu-placeholder"></div>


	<div id="grand-texte"> Fiche 1</div>
	<div id="contenu">
		<h2>Finalement, le cours commence à la 
			<a href="/pages/fiches/fiche2.html">fiche 2.</a>
	</div>

</body>
<script>
fetch("/pages/menu.html")
  .then(response => response.text())
  .then(data => {
    document.getElementById("menu-placeholder").innerHTML = data;

    // -- init du mode sombre (exécuté immédiatement après l'injection) --
    (function initTheme() {
      const body = document.body;

      // appliquer la préférence sauvegardée
      if (localStorage.getItem('theme') === 'dark') {
        body.classList.add('dark-mode');
      }

     // trouver tous les boutons/éléments qui doivent toggler le thème
      const toggles = document.querySelectorAll('.theme-toggle');

      // sécuritiy check si aucun toggle trouvé
      /* if (!toggles || toggles.length === 0) {
        // console.log('Aucun .theme-toggle trouvé'); // décommenter pour debug
        return;
      } */

      toggles.forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault(); // au cas où c'est un <a>
          body.classList.toggle('dark-mode');
          const theme = body.classList.contains('dark-mode') ? 'dark' : 'light';
          localStorage.setItem('theme', theme);
        });
      });
    })();
  })
	// .catch(err => console.error("Erreur de chargement du menu :", err));
</script>
</html>
