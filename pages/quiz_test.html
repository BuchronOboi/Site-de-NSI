<!DOCTYPE html>
<html lang="fr">

<head>
	<title> NSI - Clément LEVAL </title>
	<meta charset="utf-8" />
<link rel="stylesheet" href="/styles/style_principal.css" type="text/css" />
</head>

<body>
  <div id="entete-de-page">
    NSI - Clément LEVAL
  </div><br>
  <div id="menu-placeholder"></div>

  <div id="grand-texte">📝 Quiz / tests</div><br>
  <h1>Cette page est encore vide, mais elle sera bientôt opérationelle !</h1>
  </div> <br />

</body>
<script>
  fetch("/pages/menu.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("menu-placeholder").innerHTML = data;
      (function initTheme() {
        const body = document.body;
        if (localStorage.getItem('theme') === 'dark') {
          body.classList.add('dark-mode');
        }
        const toggles = document.querySelectorAll('.theme-toggle');
        toggles.forEach(btn => {
          btn.addEventListener('click', (e) => {
            body.classList.toggle('dark-mode');
            const theme = body.classList.contains('dark-mode') ? 'dark' : 'light';
            localStorage.setItem('theme', theme);
          });
        });
      })();
    })
</script>

</html>
